[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/weronikaolejniczak/component-usage"
publish = false

[workspace.dependencies]
component-usage-parse = { path = "crates/parse" }
component-usage-graph = { path = "crates/graph" }
component-usage-resolve = { path = "crates/resolve" }
component-usage-query = { path = "crates/query" }
component-usage-report = { path = "crates/report" }

clap = { version = "4", features = ["derive"] }

[profile.release]
lto = true
codegen-units = 1
