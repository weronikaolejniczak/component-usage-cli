[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/weronikaolejniczak/component-usage-cli"
publish = false

[workspace.dependencies]
component-usage-cli-parse = { path = "crates/parse" }
component-usage-cli-graph = { path = "crates/graph" }
component-usage-cli-resolve = { path = "crates/resolve" }
component-usage-cli-query = { path = "crates/query" }
component-usage-cli-report = { path = "crates/report" }

clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
