[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/weronikaolejniczak/component-usage-cli"
publish = false

[workspace.dependencies]
model = { package = "component-usage-cli-model", path = "crates/model" }
parse = { package = "component-usage-cli-parse", path = "crates/parse" }
graph = { package = "component-usage-cli-graph", path = "crates/graph" }
identify = { package = "component-usage-cli-identify", path = "crates/identify" }
values = { package = "component-usage-cli-values", path = "crates/values" }
report = { package = "component-usage-cli-report", path = "crates/report" }
engine = { package = "component-usage-cli-engine", path = "crates/engine" }

clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
