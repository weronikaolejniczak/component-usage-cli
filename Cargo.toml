[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT"
repository = "https://github.com/weronikaolejniczak/component-usage-cli"
publish = false

[workspace.dependencies]
model = { package = "component-usage-cli-model", path = "crates/model" }
parse = { package = "component-usage-cli-parse", path = "crates/parse" }
graph = { package = "component-usage-cli-graph", path = "crates/graph" }
identify = { package = "component-usage-cli-identify", path = "crates/identify" }
values = { package = "component-usage-cli-values", path = "crates/values" }
report = { package = "component-usage-cli-report", path = "crates/report" }
engine = { package = "component-usage-cli-engine", path = "crates/engine" }
owners = { package = "component-usage-cli-owners", path = "crates/owners" }

clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ignore = "0.4"
rayon = "1"
tempfile = "3"

oxc_allocator = "0.158"
oxc_ast = "0.158"
oxc_ast_visit = "0.158"
oxc_diagnostics = "0.158"
oxc_parser = "0.158"
oxc_semantic = "0.158"
oxc_span = "0.158"
oxc_syntax = "0.158"
oxc_resolver = "11"

[profile.release]
lto = true
codegen-units = 1
